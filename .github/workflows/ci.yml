name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # One run, on the newest Python. The oldest supported (3.11, as
    # requires-python says) is still checked statically: ruff and mypy
    # target it.
    name: Verify (Python 3.15)
    # Pinned: Playwright 1.55 (pinned in the test extra) installs no Chromium
    # on Ubuntu 26.04, which ubuntu-latest became in November 2026.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
        env:
          # Line endings are mixed on purpose and artwork is hashed byte for byte.
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: "false"
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.15"
          cache: pip

      - run: python -m pip install -e ".[test]"

      # Lint, format, types, line endings, naming, docs, plugin package,
      # then the unit and skill suites without the slow sweeps.
      - run: python -m infragram verify:quick

      - run: python -m infragram verify:inventory
