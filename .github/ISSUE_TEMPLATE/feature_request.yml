name: Feature request
description: Suggest a library, frame, editor interaction, export adapter, or improvement.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Ideas are welcome. Before submitting, read `docs/architecture/scope.md` - infrastructure editing and export are in scope; editorial diagrams and L2/L3 network engineering are not.
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to show or do?
      description: Describe the infrastructure and what the reader or editor needs. A sketch or an .infragram.json fragment helps a lot.
      placeholder: "I want to model a hub-and-spoke VNet estate with… and the editor should…"
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How could the editor or a library serve this? New components, frames, an interaction, an export format, docs?
      placeholder: "A `custom-boundary-azure-hub-vnet` frame, or a `peering` connection kind…"
  - type: dropdown
    id: scope
    attributes:
      label: Scope
      description: Roughly how much surface does this touch?
      options:
        - New provider library (importer + catalog + theme + frames + reference)
        - New frames or a starter stack for an existing library
        - Editor interaction (canvas, inspector, layers, arrange)
        - Export format or adapter
        - Project document schema
        - Tooling / scripts / CI
        - Documentation only
        - Not sure yet - help me scope it
    validations:
      required: true
  - type: checkboxes
    id: fit
    attributes:
      label: Fit
      options:
        - label: "This stays within the scope statement (cloud, platform, on-premises infrastructure)"
        - label: "Any new artwork has a known source and license"
        - label: "I'm willing to contribute the implementation or pair with a maintainer"
